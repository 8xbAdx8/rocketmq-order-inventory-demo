# 单机学习环境中的 Broker 集群名称。
brokerClusterName=DefaultCluster

# Broker 名称。后续若配置主从，Master 和 Slave 需使用相同 brokerName。
brokerName=broker-a

# brokerId=0 表示 Master；大于 0 时表示 Slave。
brokerId=0

# Broker 向 NameServer 注册时宣告的地址。
# Java 应用与 Broker 都运行在本机，因此使用回环地址。
brokerIP1=127.0.0.1

# Broker 向该 NameServer 注册 Topic 与 Message Queue 路由。
namesrvAddr=127.0.0.1:9876

# Broker 处理 Producer/Consumer 请求的主端口。
listenPort=10911

# 仅为学习环境开启 Topic 自动创建。
# 企业生产环境通常关闭，改由运维平台审核并预先创建 Topic。
autoCreateTopicEnable=true

# 每天凌晨 4 点执行过期文件删除检查，消息文件保留 48 小时。
deleteWhen=04
fileReservedTime=48

# 单 Master 学习环境：不等待 Slave 复制，也不强制每条消息同步刷盘。
# 这优先保证本地调试速度，不代表生产环境的可靠性配置。
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH

# 把消息存储在当前教学项目下，便于观察和清理实验数据。
storePathRootDir=D:/codexproject/RocketMQ/infrastructure/rocketmq/data/store
storePathCommitLog=D:/codexproject/RocketMQ/infrastructure/rocketmq/data/store/commitlog
